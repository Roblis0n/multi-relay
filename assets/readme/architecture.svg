<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Multi Relay architecture</title>
  <desc id="desc">Codex and Claude Code use a loopback gateway, target pools, operating-system vault credentials, and protocol adapters.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8495ad" stroke-width="1" opacity=".05"/>
    </pattern>
    <radialGradient id="relayGlow">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity=".10"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowRoute" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#4d6bfe"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8495ad"/>
    </marker>

  </defs>
  <rect width="1600" height="780" rx="30" fill="#08111f"/>
<rect x="0" y="0" width="1600" height="780" rx="30" fill="url(#grid)"/>
