  <text x="22" y="34" fill="#4d6bfe" font-size="14" font-weight="760" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">03</text>
  <text x="22" y="72" fill="#edf3fb" font-size="20" font-weight="740" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.3">TRANSACTION</text>
  <text x="22" y="104" fill="#8495ad" font-size="13" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">atomic install</text>
  <path d="M22 122H238" stroke="#8495ad" stroke-opacity=".20"/>
  <text x="22" y="148" fill="#4d6bfe" font-size="11" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.8">BACKUP FIRST</text>
</g>
<g transform="translate(972 164)">
  <rect width="260" height="164" rx="20" fill="#0d1a2d" stroke="#8495ad" stroke-opacity=".28"/>
  <text x="22" y="34" fill="#4d6bfe" font-size="14" font-weight="760" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">04</text>
  <text x="22" y="72" fill="#edf3fb" font-size="20" font-weight="740" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.3">NATIVE FAN-OUT</text>
  <text x="22" y="104" fill="#8495ad" font-size="13" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">default • worker • explorer</text>
  <path d="M22 122H238" stroke="#8495ad" stroke-opacity=".20"/>
  <text x="22" y="148" fill="#4d6bfe" font-size="11" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.8">8-WAY FAN-OUT</text>
</g>
<g transform="translate(1278 164)">
  <rect width="260" height="164" rx="20" fill="#0d1a2d" stroke="#42d392" stroke-opacity=".72"/>
  <text x="22" y="34" fill="#4d6bfe" font-size="14" font-weight="760" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">05</text>
  <text x="22" y="72" fill="#42d392" font-size="20" font-weight="740" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.3">VERIFY</text>
  <text x="22" y="104" fill="#8495ad" font-size="13" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">real Codex acceptance</text>
  <path d="M22 122H238" stroke="#8495ad" stroke-opacity=".20"/>
  <text x="22" y="148" fill="#42d392" font-size="11" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.8">READY</text>
</g>
<path d="M314 246H346" fill="none" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrowRoute)"/>
<path d="M620 246H652" fill="none" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrowRoute)"/>
<path d="M926 246H958" fill="none" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrowRoute)"/>
<path d="M1232 246H1264" fill="none" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrowRoute)"/>
<path data-route="rollback" d="M1408 328V348" fill="none" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowWarning)"/>
<g transform="translate(1278 354)" data-component="rollback-card">
  <rect width="260" height="58" rx="16" fill="#f2b84b" fill-opacity=".08" stroke="#f2b84b" stroke-opacity=".50"/>
  <text x="20" y="23" fill="#f2b84b" font-size="10" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.8">ANY FAILURE</text>
  <text x="20" y="46" fill="#f2b84b" font-size="15" font-weight="760" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="1">ROLLBACK</text>
  <text x="238" y="37" fill="#8495ad" font-size="10" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="end" letter-spacing="0.6">AUTO RESTORE</text>
</g>
<text x="54" y="404" fill="#8495ad" font-size="13" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.5">CREDENTIAL → MODEL PROBE → TRANSACTION → 8-WAY FAN-OUT → VERIFY</text>
<text x="1546" y="438" fill="#8495ad" font-size="12" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="end" letter-spacing="1">codex-deepseek-relay</text>
