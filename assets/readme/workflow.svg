<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Relay setup and verification workflow</title>
  <desc id="desc">Credential storage, DeepSeek model probing, transactional installation, native eight-way fan-out, verification, and automatic rollback.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8495ad" stroke-width="1" opacity=".05"/>
    </pattern>
    <radialGradient id="relayGlow">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity=".10"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowRoute" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#4d6bfe"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8495ad"/>
    </marker>
    <marker id="arrowWarning" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#f2b84b"/>
    </marker>
  </defs>
  <rect width="1600" height="460" rx="30" fill="#08111f"/>
<rect width="1600" height="460" rx="30" fill="url(#grid)"/>
<text x="54" y="62" fill="#edf3fb" font-size="36" font-weight="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" text-anchor="start" letter-spacing="-0.5">Configure once. Prove every boundary.</text>
<text x="54" y="98" fill="#8495ad" font-size="16" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">A guarded install path with an automatic way back.</text>
<g transform="translate(1260 48)">
  <rect width="284" height="34" rx="17" fill="#42d392" opacity=".12" stroke="#42d392" stroke-opacity=".45"/>
  <circle cx="18" cy="17" r="4" fill="#42d392"/>
  <text x="31" y="22" fill="#42d392" font-size="13" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="1.1">TRANSACTIONAL • VERIFIED</text>
</g>
<g transform="translate(54 164)">
  <rect width="260" height="164" rx="20" fill="#0d1a2d" stroke="#8495ad" stroke-opacity=".28"/>
  <text x="22" y="34" fill="#4d6bfe" font-size="14" font-weight="760" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">01</text>
  <text x="22" y="72" fill="#edf3fb" font-size="20" font-weight="740" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.3">CREDENTIAL</text>
  <text x="22" y="104" fill="#8495ad" font-size="13" font-weight="500" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start">system credential store</text>
  <path d="M22 122H238" stroke="#8495ad" stroke-opacity=".20"/>
  <text x="22" y="148" fill="#4d6bfe" font-size="11" font-weight="700" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, Menlo, monospace" text-anchor="start" letter-spacing="0.8">NO KEY IN LOGS</text>
</g>
<g transform="translate(360 164)">
